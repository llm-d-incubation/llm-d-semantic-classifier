# Prod-like validation on validation/pr-<id>-<sha> refs (STUB — grows with the service).
# Never developed on directly; failures return to the agent branch.
name: validation
on:
  push:
    branches: ["validation/**"]
permissions:
  contents: read
jobs:
  prod-like:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - run: sudo apt-get update -q && sudo apt-get install -y -q protobuf-compiler
      - run: ./hack/test-all
      - name: model parity suite (pinned fetch + ignored tests)
        run: |
          rustup toolchain install stable --profile minimal
          pip3 install -q huggingface-hub
          ./hack/test-parity
      # container build, compatibility matrix, EvalHub suite, MLflow evidence: added
      # when the service exists (see README lifecycle).
