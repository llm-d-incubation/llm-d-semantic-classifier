[package]
name = "llm-d-sc"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "llm-d-sc semantic classification runtime"

[lib]
name = "llm_d_sc"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
unicode_categories = "0.1"
unicode-normalization = "0.1"
candle-core = "0.11"
candle-nn = "0.11"
candle-transformers = "0.11"
tonic = "0.14"
prost = "0.14"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "macros"] }
tokio-stream = "0.1"
tonic-prost = "0.14"
blake3 = "1.8.6"
tokenizers = "0.23.1"

[build-dependencies]
tonic-prost-build = "0.14"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
incremental = false
debug = false
strip = "symbols"
