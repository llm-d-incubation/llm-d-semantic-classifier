[package]
name = "llm-d-sc"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "llm-d-sc semantic classification runtime"

[lib]
name = "llm_d_sc"
path = "src/lib.rs"

[[bin]]
name = "llm-d-sc-server"
path = "src/bin/server.rs"

[[bin]]
name = "llm-d-sc-classify"
path = "src/bin/classify.rs"

[[bin]]
name = "llm-d-sc-gateway-probe"
path = "src/bin/gateway-probe.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
unicode_categories = "0.1"
unicode-normalization = "0.1"
candle-core = "0.11"
candle-nn = "0.11"
candle-transformers = "0.11"
tonic = "0.14"
prost = "0.14"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "macros"] }
tokio-stream = "0.1"
tonic-prost = "0.14"
blake3 = "1.8.6"
# default-features = false drops three build-time dependencies we never use:
# esaxx-rs (C++, only needed by the unigram TRAINER), onig (C oniguruma), and
# indicatif (progress bars). We only load a pretrained tokenizer.json via
# Tokenizer::from_file, so none of them are reachable. Keeping them made a
# working C++ toolchain a hard build requirement and broke contributors on
# recent macOS/Xcode. A regex backend is mandatory, so fancy-regex (pure Rust)
# replaces onig (C). The result needs no C or C++ toolchain at all.
tokenizers = { version = "0.23.1", default-features = false, features = ["fancy-regex"] }
redis = { version = "0.32.2", features = ["r2d2"] }
r2d2 = "0.8.10"

[build-dependencies]
tonic-prost-build = "0.14"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
incremental = false
debug = false
strip = "symbols"
