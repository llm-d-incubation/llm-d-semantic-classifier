syntax = "proto3";

package classify;

// AC-009: a long-lived classification service that returns versioned semantic
// evidence (ranked signals), never a final route (AC-010).

// A classification request from the (dummy) Praxis client.
message ClassifyRequest {
  string request_id = 1;
  string session_id = 2;
  string context = 3;
  repeated string signals = 4;
}

// The semantic evidence produced by llm-d-sc.
//
// Carries request_id and ranked semantic signal names only. The schema contains
// NO route/endpoint field (ADR-0001, AC-010): routing/session authority stays
// with Praxis, and a route is unrepresentable on the wire rather than merely
// discouraged.
message ClassifyResponse {
  string request_id = 1;
  // Ranked semantic signal names; never a final route (AC-010).
  repeated string signals = 2;
}

service Classify {
  rpc Classify(ClassifyRequest) returns (ClassifyResponse);
}
